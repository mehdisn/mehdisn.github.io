bio: >-
  I am a Software Engineer and Researcher working at the intersection of Software Engineering
  and Artificial Intelligence. My research interests include Empirical Software Engineering,
  Mining Software Repositories, AI for Software Engineering, and Natural Language Processing.
  I work on applying data-driven approaches, machine learning, and large-scale software
  repository analysis to understand software development practices and build intelligent
  software systems. My research focuses on understanding software ecosystems through
  empirical studies and developing AI-driven approaches to improve software development.
  My work has been published in Empirical Software Engineering (EMSE) and presented
  at ICSE.
